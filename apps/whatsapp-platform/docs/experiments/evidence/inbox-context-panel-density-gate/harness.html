<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inbox context panel Fatia 4 — gate</title>
  <style>
    :root {
      --bg:#0a1110; --elev:#131f1d; --brand:#00d084; --text:#f4faf8; --muted:#8fa39b; --sec:#c5d4ce; --border:rgba(148,163,184,.22);
    }
    *{box-sizing:border-box} body{margin:0;font-family:ui-sans-serif,system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}
    .page{padding:16px;max-width:1100px;margin:0 auto}
    .tb{font-size:12px;color:var(--muted);margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .tb button{font:inherit;font-size:11px;font-weight:600;padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--elev);color:var(--sec);cursor:pointer}
    .tb button.active{border-color:var(--brand);color:var(--brand)}
    .layout{display:grid;grid-template-columns:1fr 280px;gap:12px;min-height:420px}
    .layout.stack{grid-template-columns:1fr}
    .layout.drawer-mode .aside{position:fixed;right:0;top:0;bottom:0;width:min(22rem,92vw);z-index:5;box-shadow:0 0 40px rgba(0,0,0,.45)}
    .layout.drawer-mode .chat{opacity:.55}
    .panel{border:1px solid var(--border);border-radius:12px;background:#0d1614;overflow:hidden;display:flex;flex-direction:column}
    .chat .body{flex:1;padding:12px;font-size:12px;color:var(--sec)}
    .bubble{background:var(--elev);padding:8px 10px;border-radius:10px;max-width:80%;margin-bottom:8px}
    .composer{padding:10px;border-top:1px solid var(--border);font-size:11px;color:var(--muted)}
    .aside{max-height:520px}
    .aside h3{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--sec)}
    .aside .sub{font-size:10px;color:var(--muted);margin-top:2px}
    .hd{padding:10px 12px;border-bottom:1px solid var(--border)}
    .tabs{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
    .tab{border:0;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:700;background:#1a2623;color:var(--muted);cursor:pointer}
    .tab.on{background:var(--brand);color:#04140f}
    .scroll{padding:10px 12px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:8px}
    .card{border:1px solid var(--border);border-radius:10px;padding:8px 10px;background:var(--elev)}
    .card h4{margin:0 0 6px;font-size:10px;text-transform:uppercase;color:var(--muted)}
    .bar{height:8px;border-radius:999px;background:#24302c;overflow:hidden}
    .bar>i{display:block;height:100%;background:linear-gradient(90deg,#0ea5e9,var(--brand));width:72%}
    .prio{height:4px;border-radius:999px;background:#ef4444;margin:4px 0}
    .muted{font-size:11px;color:var(--muted)}
    .before .order-note{font-size:10px;color:#fbbf24;margin-bottom:6px}
  </style>
</head>
<body>
  <div class="page">
    <div class="tb">
      <span id="label">gate · after · xl</span>
      <button type="button" data-mode="after" class="active">After</button>
      <button type="button" data-mode="before">Before</button>
      <button type="button" data-vp="xl" class="active">xl</button>
      <button type="button" data-vp="drawer">drawer</button>
      <button type="button" data-vp="stack">stack</button>
      <button type="button" data-vp="focus">focus mobile</button>
      <button type="button" data-role="operator" class="active">operator</button>
      <button type="button" data-role="admin">platform_admin</button>
      <button type="button" data-tab="resumo" class="active">Resumo</button>
      <button type="button" data-tab="crm">CRM</button>
    </div>
    <div id="mount"></div>
  </div>
  <script>
    let mode="after", vp="xl", role="operator", tab="resumo";
    function render(){
      document.getElementById("label").textContent=`gate · ${mode} · ${vp} · ${role} · ${tab}`;
      const glanceFirst = mode==="after";
      const showAside = vp!=="focus";
      const layoutClass = vp==="stack"||vp==="focus" ? "layout stack" : vp==="drawer" ? "layout drawer-mode" : "layout";
      const glance=`<div class="card"><h4>Prioridade e score</h4><div class="prio"></div><div class="muted">Alta</div><div class="bar"><i></i></div><div><b>72</b> / 100</div></div>`;
      const situacao=`<div class="card"><h4>${mode==="after"?"Situação":"Situação da conversa"}</h4><div class="muted">Precisa resposta · Em atendimento</div><div class="muted">Responsável: Sem responsável</div></div>`;
      const crm=`<div class="card"><h4>CRM e dados extraídos</h4><div class="prio"></div><div class="bar"><i></i></div><div class="muted">Score dup (C4)</div><div>Funil: Qualificação</div><div>Nome: Alfa · Interesse: Plano Pro</div>${role==="admin"?`<div style="margin-top:8px;padding:8px;border:1px dashed var(--border);border-radius:8px;font-size:11px">Prospect DevFlow (admin)</div>`:`<div class="muted" style="margin-top:6px">Sem Prospect (não admin)</div>`}</div>`;
      const resumo = glanceFirst ? `${glance}${situacao}` : `<div class="before order-note">Before: Situação antes do score</div>${situacao}${glance}`;
      const body = tab==="crm" ? crm : resumo;
      document.getElementById("mount").innerHTML=`
        <div class="${layoutClass}">
          <section class="panel chat">
            <div class="hd muted">Chat · KEEP 1–3</div>
            <div class="body"><div class="bubble">Cliente: Preciso de proposta.</div></div>
            <div class="composer">▸ DealClose · textarea + Enviar · Assistências</div>
          </section>
          ${showAside?`<aside class="panel aside">
            <div class="hd"><h3>Contexto do cliente</h3><div class="sub">${mode==="after"?"Glance comercial primeiro — detalhes nas tabs.":"Separado por separadores"}</div>
              <div class="tabs">
                <span class="tab ${tab==="resumo"?"on":""}">Resumo</span>
                <span class="tab">Próxima ação</span>
                <span class="tab ${tab==="crm"?"on":""}">CRM</span>
                <span class="tab">Contexto</span>
              </div>
            </div>
            <div class="scroll">${body}</div>
          </aside>`:`<div class="panel" style="padding:16px"><p class="muted">Focus mobile (!FREE): sem CRM — C5 preservado</p></div>`}
        </div>`;
    }
    document.querySelector(".tb").addEventListener("click",(e)=>{
      const b=e.target.closest("button"); if(!b) return;
      for (const k of ["mode","vp","role","tab"]) if(b.dataset[k]!=null){
        if(k==="mode") mode=b.dataset.mode;
        if(k==="vp") vp=b.dataset.vp;
        if(k==="role") role=b.dataset.role;
        if(k==="tab") tab=b.dataset.tab;
        document.querySelectorAll(`[data-${k}]`).forEach(x=>x.classList.toggle("active",x===b));
      }
      render();
    });
    render();
  </script>
</body>
</html>
