<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inbox ChatHeader density — Fatia 2 gate</title>
  <style>
    :root {
      --df-bg-app: #0a1110;
      --df-bg-elevated: #131f1d;
      --df-brand-100: rgba(0, 208, 132, 0.12);
      --df-brand-500: #00d084;
      --df-brand-600: #00d084;
      --df-text-primary: #f4faf8;
      --df-text-secondary: #c5d4ce;
      --df-text-muted: #8fa39b;
      --df-warning: #d97706;
      --df-danger: #ef4444;
      --df-border: rgba(148, 163, 184, 0.22);
      --df-sheet: #0d1614;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, Segoe UI, sans-serif; background: var(--df-bg-app); color: var(--df-text-primary); }
    .page { padding: 16px; max-width: 1100px; margin: 0 auto; }
    .toolbar { font-size: 12px; color: var(--df-text-muted); margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .toolbar button { font: inherit; font-size: 11px; font-weight: 600; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--df-border); background: var(--df-bg-elevated); color: var(--df-text-secondary); cursor: pointer; }
    .toolbar button.active { border-color: var(--df-brand-500); color: var(--df-brand-500); }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
    .panel { border: 1px solid var(--df-border); border-radius: 12px; overflow: hidden; background: var(--df-sheet); }
    .panel h2 { margin: 0; padding: 10px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--df-text-muted); border-bottom: 1px solid var(--df-border); }
    .stack { padding: 0; }
    .banner {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 14px; border-bottom: 1px solid rgba(239,68,68,.35);
      background: color-mix(in srgb, #3a1515 45%, var(--df-bg-elevated));
      font-size: 12px;
    }
    .banner strong { color: #fecaca; }
    .banner .cta { border: 0; border-radius: 8px; padding: 6px 12px; font-size: 11px; font-weight: 700; background: #fca5a5; color: #450a0a; }
    .header { padding: 12px 14px; border-bottom: 1px solid var(--df-border); background: var(--df-bg-elevated); }
    .row { display: flex; gap: 12px; align-items: flex-start; }
    .av { width: 44px; height: 44px; border-radius: 999px; flex-shrink: 0; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--df-brand-600); color: #04140f; }
    .av.sm { width: 36px; height: 36px; font-size: 11px; }
    .main { min-width: 0; flex: 1; }
    .title { margin: 0; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .phone { margin: 2px 0 0; font-size: 12px; color: var(--df-text-secondary); }
    .chips { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--df-border); color: var(--df-text-secondary); }
    .chip.state { background: rgba(239,68,68,.15); color: #fca5a5; border-color: rgba(239,68,68,.35); }
    .chip.sla { background: rgba(249,115,22,.14); color: #fdba74; border-color: rgba(249,115,22,.4); }
    .chip.open { background: rgba(16,185,129,.14); color: #6ee7b7; }
    .chip.prio { background: rgba(248,113,113,.14); color: #fca5a5; }
    .chip.muted { color: var(--df-text-muted); }
    .assignee { margin: 8px 0 0; font-size: 12px; color: var(--df-text-secondary); }
    .assignee strong { color: var(--df-text-primary); }
    .zone-b { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(148,163,184,.22); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .btn { border: 0; border-radius: 8px; padding: 6px 10px; font-size: 11px; font-weight: 700; min-height: 32px; cursor: pointer; }
    .btn.primary { background: var(--df-brand-500); color: #04140f; }
    .btn.primary.urgent { box-shadow: 0 0 0 2px rgba(252,165,165,.55); }
    .btn.primary:focus-visible, .btn.sec:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--df-bg-app), 0 0 0 4px var(--df-brand-500); }
    .btn.sec { background: transparent; color: var(--df-text-secondary); border: 1px solid var(--df-border); }
    .clutter { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #ef4444; color: #fff; }
    .more-panel { margin-top: 8px; padding: 10px; border: 1px solid var(--df-border); border-radius: 10px; background: #0a1210; display: flex; flex-direction: column; gap: 6px; }
    .more-panel .btn { width: 100%; text-align: left; justify-content: flex-start; }
    .thread { padding: 14px; font-size: 12px; color: var(--df-text-muted); min-height: 72px; }
    .mobile .header { padding: 10px 12px; }
    .mobile .av { width: 36px; height: 36px; font-size: 11px; }
    .mobile .title { font-size: 14px; }
    .hidden { display: none !important; }
    .label-row { font-size: 10px; color: var(--df-text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
  </style>
</head>
<body>
  <div class="page">
    <div class="toolbar">
      <span id="label">gate · after · desktop</span>
      <button type="button" data-mode="after" class="active">After</button>
      <button type="button" data-mode="before">Before</button>
      <button type="button" data-vp="desktop" class="active">1440</button>
      <button type="button" data-vp="mobile">390</button>
      <button type="button" data-focus="none" class="active">Sem foco</button>
      <button type="button" data-focus="assume">Foco Assumir</button>
      <button type="button" data-focus="close">Foco Encerrar</button>
      <button type="button" data-more="0" class="active">Mais fechado</button>
      <button type="button" data-more="1">Mais aberto</button>
    </div>
    <div class="cols" id="mount"></div>
  </div>
  <script>
    const scenarios = [
      {
        id: "unowned-sla",
        title: "Sem dono + SLA + banner",
        banner: true,
        after: { name: "Ana Barbosa", phone: "5511999…", state: "Precisa resposta", sla: "Crítico · 12 min", assignee: "Sem responsável — precisa de resposta humana", assume: true, close: true, assigneeMenu: "Responsável…" },
        before: { name: "Ana Barbosa", phone: "5511999…", chips: ["Aberta", "Precisa resposta", "Prioridade alta", "Crítico · 12 min", "Linha Suporte", "Fila Geral"], tags: ["VIP"], assignee: "Sem responsável — precisa de resposta humana", assume: true, close: true, notes: true, hist: true, status: true, assigneeMenu: "Responsável…" },
      },
      {
        id: "assigned",
        title: "Com dono, sem SLA crítico",
        banner: false,
        after: { name: "João Mendes", phone: "5511888…", state: "Em atendimento", assignee: "Responsável: Você", close: true, release: true, assigneeMenu: "Você" },
        before: { name: "João Mendes", phone: "5511888…", chips: ["Aberta", "Em atendimento", "SLA OK", "Linha Suporte"], tags: ["Lead"], assignee: "Responsável: Você", close: true, release: true, notes: true, hist: true, status: true, assigneeMenu: "Você" },
      },
      {
        id: "closed",
        title: "Encerrada",
        banner: false,
        after: { name: "Loja Porto", phone: "5511777…", state: "Encerrada", assignee: "Responsável: —", reopen: true },
        before: { name: "Loja Porto", phone: "5511777…", chips: ["Fechada", "Encerrada"], assignee: "Responsável: —", reopen: true, notes: true, hist: true, status: true },
      },
    ];

    let mode = "after";
    let vp = "desktop";
    let focus = "none";
    let moreOpen = false;

    function btn(cls, label, attrs = "") {
      return `<button type="button" class="btn ${cls}" ${attrs}>${label}</button>`;
    }

    function renderHeader(data, isAfter) {
      const clutter = !isAfter
        ? `<div class="clutter">${(data.chips || []).map((c) => `<span class="chip muted">${c}</span>`).join("")}${(data.tags || []).map((t) => `<span class="tag">${t}</span>`).join("")}</div>`
        : "";
      const chips = isAfter
        ? `<div class="chips">
            <span class="chip state">${data.state}</span>
            ${data.sla ? `<span class="chip sla">${data.sla}</span>` : ""}
          </div>`
        : `<div class="chips">
            ${(data.chips || []).slice(0, 4).map((c, i) => `<span class="chip ${i === 0 ? "open" : i === 1 ? "state" : i === 2 ? "prio" : "sla"}">${c}</span>`).join("")}
          </div>`;

      let zoneB = `<div class="zone-b">`;
      if (data.assume) zoneB += btn(`primary${focus === "assume" ? "" : ""} urgent`, "Assumir", focus === "assume" ? "autofocus data-focus-target" : 'data-testid="assume"');
      if (data.close) zoneB += btn("sec", "Encerrar", focus === "close" ? "autofocus data-focus-target" : "");
      if (data.reopen) zoneB += btn("sec", "Reabrir");
      if (data.release) zoneB += btn("sec", "Liberar");
      if (data.assigneeMenu) zoneB += btn("sec", data.assigneeMenu);
      if (!isAfter) {
        if (data.status) zoneB += btn("sec", "Estado");
        if (data.notes) zoneB += btn("sec", "Notas");
        if (data.hist) zoneB += btn("sec", "Histórico");
      } else {
        zoneB += btn("sec", "Mais");
      }
      zoneB += `</div>`;

      const more = isAfter && moreOpen
        ? `<div class="more-panel" role="menu" aria-label="Mais ações da conversa">
            ${btn("sec", "Estado da thread")}
            <div class="clutter"><span class="tag">VIP</span>${btn("sec", "+ Tag")}</div>
            ${btn("sec", "Notas")}
            ${btn("sec", "Histórico")}
            <p style="margin:4px 0 0;font-size:11px;color:var(--df-text-muted)">Linha: Suporte · Fila: Geral</p>
          </div>`
        : "";

      return `
        <div class="header ${vp === "mobile" ? "mobile" : ""}">
          <div class="row">
            ${vp === "mobile" ? btn("sec", "← Voltar") : ""}
            <div class="av ${vp === "mobile" ? "sm" : ""}">${data.name.slice(0, 2).toUpperCase()}</div>
            <div class="main">
              <h3 class="title">${data.name}</h3>
              <p class="phone">${data.phone}</p>
              ${isAfter ? chips : clutter}
              <p class="assignee"><strong>${data.assignee}</strong></p>
              ${zoneB}
              ${more}
            </div>
          </div>
        </div>`;
    }

    function render() {
      document.getElementById("label").textContent = `gate · ${mode} · ${vp}${moreOpen ? " · mais aberto" : ""}${focus !== "none" ? " · foco " + focus : ""}`;
      const mount = document.getElementById("mount");
      mount.innerHTML = scenarios.map((s) => {
        const data = mode === "after" ? s.after : s.before;
        const banner = s.banner
          ? `<div class="banner"><div><strong>Resposta urgente</strong> — cliente à espera</div><button type="button" class="cta">Responder agora</button></div>`
          : "";
        return `<section class="panel">
          <h2>${s.title}</h2>
          <div class="stack">
            ${banner}
            ${renderHeader(data, mode === "after")}
            <div class="thread">Prévia da thread…</div>
          </div>
        </section>`;
      }).join("");
      const t = document.querySelector("[data-focus-target]");
      if (t) t.focus();
    }

    document.querySelector(".toolbar").addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      if (b.dataset.mode) {
        mode = b.dataset.mode;
        document.querySelectorAll("[data-mode]").forEach((x) => x.classList.toggle("active", x === b));
      }
      if (b.dataset.vp) {
        vp = b.dataset.vp;
        document.querySelectorAll("[data-vp]").forEach((x) => x.classList.toggle("active", x === b));
        document.documentElement.style.width = vp === "mobile" ? "390px" : "";
      }
      if (b.dataset.focus) {
        focus = b.dataset.focus;
        document.querySelectorAll("[data-focus]").forEach((x) => x.classList.toggle("active", x === b));
      }
      if (b.dataset.more != null) {
        moreOpen = b.dataset.more === "1";
        document.querySelectorAll("[data-more]").forEach((x) => x.classList.toggle("active", x === b));
      }
      render();
    });

    render();
  </script>
</body>
</html>
