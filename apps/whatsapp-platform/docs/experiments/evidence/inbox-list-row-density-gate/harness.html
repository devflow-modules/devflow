<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inbox list density — gate #163</title>
  <style>
    :root {
      --df-bg-app: #0a1110;
      --df-bg-elevated: #131f1d;
      --df-brand-100: rgba(0, 208, 132, 0.12);
      --df-brand-500: #00d084;
      --df-brand-600: #00d084;
      --df-brand-700: #009e64;
      --df-brand-900: #005c3a;
      --df-text-primary: #f4faf8;
      --df-text-secondary: #c5d4ce;
      --df-text-muted: #8fa39b;
      --df-warning: #d97706;
      --df-danger: #ef4444;
      --df-border: rgba(148, 163, 184, 0.22);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, Segoe UI, sans-serif; background: var(--df-bg-app); color: var(--df-text-primary); }
    .page { padding: 16px; }
    .toolbar { font-size: 12px; color: var(--df-text-muted); margin-bottom: 12px; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
    .panel { border: 1px solid var(--df-border); border-radius: 12px; overflow: hidden; background: #0d1614; }
    .panel h2 { margin: 0; padding: 10px 12px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--df-text-muted); border-bottom: 1px solid var(--df-border); }
    .list { width: 100%; max-width: 320px; }
    .row { position: relative; display: flex; align-items: stretch; border-bottom: 1px solid var(--df-border); background: var(--df-bg-elevated); }
    .row.selected { box-shadow: inset 4px 0 0 var(--df-brand-500); background: color-mix(in srgb, var(--df-bg-elevated) 88%, var(--df-brand-100)); }
    .row.urgent { box-shadow: inset 4px 0 0 var(--df-warning); background: color-mix(in srgb, #3a2a12 35%, var(--df-bg-elevated)); }
    .row.critical { box-shadow: inset 4px 0 0 var(--df-danger); background: color-mix(in srgb, #3a1515 40%, var(--df-bg-elevated)); }
    .row.unowned { box-shadow: inset 3px 0 0 rgb(217,119,6); background: color-mix(in srgb, rgba(217,119,6,.12), var(--df-bg-elevated)); }
    .main { flex: 1; min-width: 0; display: flex; gap: 10px; padding: 10px; text-align: left; border: 0; background: transparent; color: inherit; cursor: default; width: 100%; font: inherit; }
    .main:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--df-brand-500); }
    .av { width: 40px; height: 40px; border-radius: 999px; flex-shrink: 0; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--df-brand-100); color: var(--df-brand-500); }
    .row.selected .av { background: var(--df-brand-600); color: #04140f; }
    .body { min-width: 0; flex: 1; }
    .top { display: flex; justify-content: space-between; gap: 8px; }
    .name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0; }
    .time { font-size: 11px; color: var(--df-text-muted); font-variant-numeric: tabular-nums; }
    .time.warn { color: var(--df-warning); font-weight: 700; }
    .time.crit { color: var(--df-danger); font-weight: 700; }
    .unread, .pending { min-width: 1.25rem; padding: 2px 6px; border-radius: 999px; font-size: 10px; font-weight: 700; text-align: center; }
    .unread { background: var(--df-brand-700); color: #fff; }
    .pending { background: rgba(217,119,6,.25); color: #fbbf24; border: 1px solid rgba(217,119,6,.4); }
    .preview { margin: 6px 0 0; font-size: 12px; line-height: 1.35; color: var(--df-text-secondary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .pfx { color: var(--df-text-muted); font-weight: 600; }
    .foot { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .state { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: rgba(239,68,68,.15); color: #fca5a5; border: 1px solid rgba(239,68,68,.35); }
    .assignee { margin: 4px 0 0; font-size: 10px; color: var(--df-text-muted); }
    .assignee strong { color: var(--df-text-secondary); font-weight: 600; }
    .actions { display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 8px; border-left: 1px solid var(--df-border); }
    .btn { border: 0; border-radius: 8px; padding: 6px 10px; font-size: 11px; font-weight: 700; background: var(--df-brand-500); color: #04140f; min-height: 32px; }
    .btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--df-bg-app), 0 0 0 4px var(--df-brand-500); }
    .btn.ghost { background: transparent; color: var(--df-text-muted); border: 1px solid var(--df-border); }
    .chip { font-size: 9px; padding: 2px 5px; border-radius: 4px; border: 1px solid var(--df-border); color: var(--df-text-muted); }
    .clutter { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
    .tag { font-size: 10px; color: var(--df-text-muted); padding: 6px 10px; border-bottom: 1px solid var(--df-border); background: #0a1210; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="page">
    <div class="toolbar" id="label">gate · after · desktop</div>
    <div class="cols" id="mount"></div>
  </div>
  <script>
    const scenarios = [
      { id: "normal", title: "Normal / awaiting_customer", after: { name: "Carlos Rua", initials: "CR", time: "1h", preview: ["Você", "Enviámos a proposta"], state: "Aguardando cliente", assignee: "Ana Silva" } },
      { id: "unread", title: "Unread only", after: { name: "Maria Reis", initials: "MR", time: "agora", unread: 2, preview: ["Cliente", "Posso ligar amanhã?"], state: "Precisa resposta", assignee: "Ana Silva", selected: true } },
      { id: "pending", title: "Pending only", after: { name: "João Mendes", initials: "JM", time: "4m", pending: 3, preview: ["Cliente", "Quero o orçamento"], state: "Precisa resposta", assignee: "Ana Silva" } },
      { id: "both", title: "Unread + pending", after: { name: "Loja Sul", initials: "LS", time: "2m", unread: 2, pending: 2, preview: ["Cliente", "Segue o comprovante"], state: "Precisa resposta", assignee: "Ana Silva" } },
      { id: "named", title: "Responsável nomeado", after: { name: "Pedro Lima", initials: "PL", time: "8m", preview: ["Cliente", "Ainda aguardo retorno"], state: "Precisa resposta", assignee: "Gustavo Marques" } },
      { id: "unowned", title: "Sem responsável", after: { name: "Ana Barbosa", initials: "AB", time: "3m", preview: ["Cliente", "Quero fechar hoje"], state: "Precisa resposta", assignee: "Sem responsável", assume: true, unowned: true } },
      { id: "sla-low", title: "SLA < 5 min (tempo relativo)", after: { name: "Rita Nunes", initials: "RN", time: "2m", preview: ["Cliente", "Olá, preciso de ajuda"], state: "Precisa resposta", assignee: "Ana Silva" } },
      { id: "sla-5", title: "SLA ≥ 5 min (exceção)", after: { name: "Bruno Costa", initials: "BC", time: "7m", timeWarn: true, preview: ["Cliente", "Podem confirmar o prazo?"], state: "Precisa resposta", assignee: "Ana Silva", urgent: true } },
      { id: "sla-crit", title: "SLA high/critical", after: { name: "Cliente VIP", initials: "CV", time: "14m", timeCrit: true, preview: ["Cliente", "Urgente: contrato hoje"], state: "Precisa resposta", assignee: "Sem responsável", assume: true, critical: true } },
    ];

    function afterRow(s) {
      const a = s.after;
      const cls = ["row", a.selected && "selected", a.critical && "critical", a.urgent && !a.critical && "urgent", a.unowned && !a.urgent && !a.critical && "unowned"].filter(Boolean).join(" ");
      return `<div class="${cls}" data-scenario="${s.id}">
        <div class="tag">${s.title}</div>
        <div style="display:flex">
          <button class="main" type="button" data-testid="conversation-item">
            <div class="av">${a.initials}</div>
            <div class="body">
              <div class="top"><div class="name">${a.name}</div>
                <div class="meta">
                  <span class="time ${a.timeCrit ? "crit" : a.timeWarn ? "warn" : ""}">${a.time}</span>
                  ${a.unread ? `<span class="unread">${a.unread}</span>` : ""}
                </div>
              </div>
              <p class="preview"><span class="pfx">${a.preview[0]}</span> · ${a.preview[1]}</p>
              <div class="foot">
                <span class="state">${a.state}</span>
                ${a.pending ? `<span class="pending" title="pending inbound">${a.pending}</span>` : ""}
              </div>
              <p class="assignee">Responsável: <strong>${a.assignee}</strong></p>
            </div>
          </button>
          ${a.assume ? `<div class="actions"><button class="btn" type="button" id="cta-${s.id}">Assumir</button></div>` : ""}
        </div>
      </div>`;
    }

    function beforeRow(s) {
      const a = s.after;
      return `<div class="row ${a.critical ? "critical" : a.urgent ? "urgent" : ""}">
        <div class="tag">${s.title} · before</div>
        <div style="display:flex">
          <button class="main" type="button">
            <div class="av">${a.initials}</div>
            <div class="body">
              <div class="top"><div class="name">${a.name}</div><div class="meta"><span class="time ${a.timeWarn||a.timeCrit?"warn":""}">${a.time}</span>${a.unread?`<span class="unread">${a.unread}</span>`:""}</div></div>
              <div class="foot"><span class="chip">Linha suporte</span></div>
              <div class="foot"><span class="state">${a.state}</span><span class="chip">Sugestão pendente</span></div>
              <p class="assignee">Responsável: <strong>${a.assignee}</strong></p>
              <p class="preview"><span class="pfx">${a.preview[0]}</span> · ${a.preview[1]}</p>
              <div class="clutter">
                <span class="chip">Prioridade CRM — alta</span>
                <span class="chip">Agir nas próximas horas</span>
                <span class="chip">42 pts</span>
                <span class="chip">ai_qualify</span>
                <span class="chip">NEG</span>
                ${a.timeWarn||a.timeCrit?`<span class="chip">Crítico · ${a.time}</span>`:""}
                ${a.pending?`<span class="chip">${a.pending}</span>`:""}
                <span class="chip">Fila VIP</span>
                ${a.assignee==="Sem responsável"?`<span class="chip">Sem responsável</span>`:""}
              </div>
            </div>
          </button>
          ${a.assume?`<div class="actions"><button class="btn" type="button">Assumir</button><button class="btn ghost" type="button">Fechar</button></div>`:""}
        </div>
      </div>`;
    }

    function render() {
      const params = new URLSearchParams(location.search);
      const version = params.get("v") === "before" ? "before" : "after";
      const focus = params.get("focus") === "1";
      const only = params.get("only");
      const list = only ? scenarios.filter(s => s.id === only) : scenarios;
      document.getElementById("label").textContent = `gate #163 · ${version} · ${only || "all states"}`;
      const html = list.map(s => version === "before" ? beforeRow(s) : afterRow(s)).join("");
      document.getElementById("mount").innerHTML = `<div class="panel"><h2>${version}</h2><div class="list">${html}</div></div>`;
      if (focus) {
        const btn = document.querySelector("[data-testid=conversation-item]") || document.querySelector(".btn");
        requestAnimationFrame(() => btn?.focus());
      }
    }
    render();
  </script>
</body>
</html>
