# Gate opcional: a11y automatizado + checagens leves do monorepo na app WhatsApp Platform.
# Segredos opcionais E2E_WHATSAPP_* desbloqueiam fluxos autenticados (sem eles: /login + skips).
# E2E_WHATSAPP_BASE_URL (secret opcional): aponta para staging — desactiva webServer local no Playwright.

name: WhatsApp Platform A11y

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 0"
  pull_request:
    paths:
      - "apps/whatsapp-platform/**"
      - ".github/workflows/whatsapp-platform-a11y.yml"

jobs:
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/whatsapp-platform

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      - name: Generate WhatsApp Prisma client
        run: pnpm db:generate

      - name: check:buttons + lint:design-system + tsc
        run: |
          pnpm check:buttons
          pnpm lint:design-system
          pnpm exec tsc --noEmit

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: test:a11y (axe + Playwright)
        env:
          CI: "1"
          # Sem E2E_WHATSAPP_* aqui: fluxos autenticados ficam skipped (matriz estável pré-secrets).
          # Smoke autenticado Fatia 5 corre no step seguinte com base local + mocks.
        run: pnpm test:a11y

      # Fatia 5: iPhone 12 + 360 + DealClose. Mocks exigem base local; credenciais via secrets.
      - name: test:e2e inbox-mobile-revenue
        env:
          CI: "1"
          E2E_WHATSAPP_ADMIN_EMAIL: ${{ secrets.E2E_WHATSAPP_ADMIN_EMAIL }}
          E2E_WHATSAPP_ADMIN_PASSWORD: ${{ secrets.E2E_WHATSAPP_ADMIN_PASSWORD }}
          E2E_WHATSAPP_BASE_URL: http://127.0.0.1:3099
          E2E_BASE_URL: http://127.0.0.1:3099
          DATABASE_URL: ${{ secrets.WHATSAPP_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.WHATSAPP_DATABASE_URL }}
        run: pnpm exec playwright test tests/e2e/inbox-mobile-revenue.spec.ts
