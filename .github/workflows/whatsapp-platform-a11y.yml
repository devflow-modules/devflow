# Gate opcional: a11y automatizado + checagens leves do monorepo na app WhatsApp Platform.
# test:a11y (axe) corre sem banco. Fatia 5 (inbox-mobile-revenue) usa Postgres de serviço
# + tenant/manager efémeros — sem secrets.WHATSAPP_DATABASE_URL nem E2E_WHATSAPP_ADMIN_*.

name: WhatsApp Platform A11y

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 0"
  pull_request:
    paths:
      - "apps/whatsapp-platform/**"
      - ".github/workflows/whatsapp-platform-a11y.yml"

jobs:
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/whatsapp-platform

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: whatsapp_a11y
          POSTGRES_PASSWORD: whatsapp_a11y_ci
          POSTGRES_DB: whatsapp_a11y
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: ${{ github.workspace }}

      - name: Generate WhatsApp Prisma client
        run: pnpm db:generate

      - name: check:buttons + lint:design-system + tsc
        run: |
          pnpm check:buttons
          pnpm lint:design-system
          pnpm exec tsc --noEmit

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: test:a11y (axe + Playwright)
        env:
          CI: "1"
          # Sem credenciais e sem DB: fluxos autenticados ficam skipped.
        run: pnpm test:a11y

      # Fatia 5: iPhone 12 + 360 + DealClose. Inbox mockada; login real contra Postgres local.
      - name: Configure ephemeral WhatsApp Postgres
        run: |
          echo "WHATSAPP_DATABASE_URL=postgresql://whatsapp_a11y:whatsapp_a11y_ci@127.0.0.1:5432/whatsapp_a11y" >> "$GITHUB_ENV"
          echo "WHATSAPP_DIRECT_URL=postgresql://whatsapp_a11y:whatsapp_a11y_ci@127.0.0.1:5432/whatsapp_a11y" >> "$GITHUB_ENV"
          echo "JWT_SECRET=ci-whatsapp-a11y-dummy-secret-min-32-chars" >> "$GITHUB_ENV"

      - name: Guard local Postgres for Fatia 5
        run: pnpm exec tsx scripts/e2e/assert-local-datasource.ts

      - name: Migrate WhatsApp schema on service Postgres
        run: pnpm exec prisma migrate deploy

      - name: test:e2e inbox-mobile-revenue
        env:
          CI: "1"
          E2E_WHATSAPP_BASE_URL: http://127.0.0.1:3099
          E2E_BASE_URL: http://127.0.0.1:3099
        run: pnpm exec tsx scripts/e2e/run-a11y-inbox-mobile.ts
