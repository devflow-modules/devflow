# Portal lint/test/quality/build plus targeted Financeiro, ApplyFlow and WhatsApp jobs.
# This is not `test:workspace` or `eslint .` — see docs/shared/GOVERNANCE_SUMMARY.md.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      # Escopo Financeiro: o eslint na raiz ainda acusa dívida no restante do monorepo.
      - name: Lint
        run: pnpm lint:ci

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  test-financeiro:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Financeiro Prisma client
        run: pnpm --filter @devflow/app-financeiro db:generate

      - name: Test Financeiro
        run: pnpm --filter @devflow/app-financeiro test

  test-applyflow:
    # Pin away from ubuntu-latest (26.04): Playwright Chromium does not yet support it.
    runs-on: ubuntu-24.04
    # Extra headroom: Playwright apt deps + isolated Next.js build.
    timeout-minutes: 45
    # Matches apps/applyflow/docker-compose.yml local Persistence V2 contract.
    # Required by AF-REL-001 PostgreSQL concurrency suite (fail-closed if unreachable).
    # Migrations MUST target only this disposable service (assert-ci-db gate).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: applyflow
          POSTGRES_PASSWORD: applyflow_local_dev
          POSTGRES_DB: applyflow
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U applyflow -d applyflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI-only non-secret credentials aligned with apps/applyflow/.env.example + docker-compose.yml
      # Never replace these with repository secrets or Production URLs.
      DATABASE_URL: postgresql://applyflow:applyflow_local_dev@localhost:5434/applyflow
      DIRECT_URL: postgresql://applyflow:applyflow_local_dev@localhost:5434/applyflow
      APPLYFLOW_DB_TARGET: local
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build ApplyFlow workspace packages
        run: |
          pnpm --filter @devflow/applyflow-core build
          pnpm --filter @devflow/career-sync build
          pnpm --filter @devflow/career-core build

      # Full core typecheck including __tests__ (tsconfig.build excludes tests).
      - name: Typecheck ApplyFlow core (including tests)
        run: pnpm --filter @devflow/applyflow-core exec tsc --noEmit -p tsconfig.json

      # Core unit suite covers technology-identity, eligibility, I20C decision-consistency, etc.
      - name: Test ApplyFlow core
        run: pnpm --filter @devflow/applyflow-core test

      - name: Generate ApplyFlow Prisma client
        run: pnpm --filter applyflow db:generate

      - name: Assert disposable CI Postgres target
        working-directory: apps/applyflow
        run: node ./scripts/ci/release-gates.cjs assert-ci-db

      - name: Migrate ApplyFlow schema on service Postgres
        working-directory: apps/applyflow
        run: pnpm exec prisma migrate deploy

      - name: Verify AF-REL-001 unique index
        working-directory: apps/applyflow
        run: |
          pnpm exec prisma db execute --schema prisma/schema.prisma --stdin <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1
              FROM pg_indexes
              WHERE tablename = 'applyflow_applications'
                AND indexname = 'applyflow_applications_account_id_source_job_id_uidx'
            ) THEN
              RAISE EXCEPTION 'AF-REL-001 unique index missing after migrate deploy';
            END IF;
          END $$;
          SQL

      - name: Lint ApplyFlow
        run: pnpm --filter applyflow exec eslint "src/**/*.{ts,tsx}"

      - name: Typecheck ApplyFlow app
        run: pnpm --filter applyflow exec tsc --noEmit -p tsconfig.json

      - name: Test ApplyFlow
        run: pnpm --filter applyflow test

      # Mutable F3.5 migration E2E — opt-in against the disposable service Postgres only.
      # Production hosts remain denylisted inside the suite even when APPLYFLOW_F3_5_E2E=1.
      - name: ApplyFlow F3.5 mutable migration E2E
        working-directory: apps/applyflow
        env:
          APPLYFLOW_F3_5_E2E: "1"
          APPLYFLOW_DB_TARGET: local
        run: |
          set -euo pipefail
          pnpm exec vitest run src/lib/persistence-v2/migration/f3-5-migration-e2e.test.tsx \
            --reporter=default --reporter=json --outputFile=f3-5-ci-result.json
          # Strict by default: rejects pending/todo/skipped and inconsistent Vitest JSON.
          node ./scripts/ci/assert-vitest-json-passed.cjs ./f3-5-ci-result.json --min-passed=17 --strict

      # Scopes-default harness needs a second disposable Postgres (port 5439) so it never
      # mutates the main ApplyFlow CI database on 5434.
      - name: Start scopes-default disposable Postgres
        run: |
          set -euo pipefail
          docker rm -f applyflow-pg-scopes-check >/dev/null 2>&1 || true
          docker run -d --name applyflow-pg-scopes-check \
            -e POSTGRES_USER=applyflow \
            -e POSTGRES_PASSWORD=applyflow_local_dev \
            -e POSTGRES_DB=applyflow_scopes_check \
            -p 5439:5432 \
            postgres:16-alpine
          for i in $(seq 1 30); do
            if docker exec applyflow-pg-scopes-check pg_isready -U applyflow -d applyflow_scopes_check; then
              exit 0
            fi
            sleep 2
          done
          echo "scopes-default Postgres failed to become ready"
          exit 1

      - name: ApplyFlow scopes-default harness
        working-directory: apps/applyflow
        env:
          APPLYFLOW_SCOPES_DEFAULT_CHECK: "1"
          SCOPES_CHECK_DATABASE_URL: postgresql://applyflow:applyflow_local_dev@127.0.0.1:5439/applyflow_scopes_check
          APPLYFLOW_DB_TARGET: local
        run: |
          set -euo pipefail
          pnpm exec vitest run --config vitest.scopes-default.config.ts \
            --reporter=default --reporter=json --outputFile=scopes-default-ci-result.json
          node ./scripts/ci/assert-vitest-json-passed.cjs ./scopes-default-ci-result.json --min-passed=3 --strict

      - name: Stop scopes-default disposable Postgres
        if: always()
        run: docker rm -f applyflow-pg-scopes-check >/dev/null 2>&1 || true

      # Isolated production-style build: synthetic DB, Preview markers, no Production secrets.
      # Limitation: GitHub-hosted runners do not provide verified OS-level network isolation;
      # preflight fails closed on prohibited credentials and secret .env* files.
      - name: Assert isolated ApplyFlow build environment
        working-directory: apps/applyflow
        env:
          VERCEL: "1"
          VERCEL_ENV: preview
          APPLYFLOW_PERSISTENCE_V2: "false"
          NEXT_TELEMETRY_DISABLED: "1"
          # Override job-level CI Postgres URLs with synthetic unreachable hosts.
          DATABASE_URL: postgresql://ci_build:ci_build@db.ci-build-isolated.invalid:5432/applyflow
          DIRECT_URL: postgresql://ci_build:ci_build@db.ci-build-isolated.invalid:5432/applyflow
          # Explicitly clear auth/provider vars if a future job env adds them.
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ""
          OPENAI_API_KEY: ""
          THEIRSTACK_API_KEY: ""
          APPLYFLOW_THEIRSTACK_API_KEY: ""
          NANGO_SECRET_KEY: ""
          STRIPE_SECRET_KEY: ""
        run: |
          set -euo pipefail
          node ./scripts/ci/release-gates.cjs assert-no-secret-env-files
          node ./scripts/ci/release-gates.cjs assert-isolated-build-env

      - name: Build ApplyFlow Next.js (isolated)
        working-directory: apps/applyflow
        env:
          VERCEL: "1"
          VERCEL_ENV: preview
          APPLYFLOW_PERSISTENCE_V2: "false"
          NEXT_TELEMETRY_DISABLED: "1"
          DATABASE_URL: postgresql://ci_build:ci_build@db.ci-build-isolated.invalid:5432/applyflow
          DIRECT_URL: postgresql://ci_build:ci_build@db.ci-build-isolated.invalid:5432/applyflow
          NEXT_PUBLIC_SUPABASE_URL: ""
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ""
          OPENAI_API_KEY: ""
          THEIRSTACK_API_KEY: ""
          APPLYFLOW_THEIRSTACK_API_KEY: ""
          NANGO_SECRET_KEY: ""
          STRIPE_SECRET_KEY: ""
        run: |
          set -euo pipefail
          node ./scripts/ci/release-gates.cjs assert-isolated-build-env
          pnpm exec prisma generate
          pnpm exec next build --webpack

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          # --with-deps can hang for 15+ minutes on azure.archive.ubuntu.com (Ign → stall).
          # Prefer archive.ubuntu.com, download browser separately, then bound apt deps.
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
              /etc/apt/sources.list.d/ubuntu.sources || true
          fi
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
              /etc/apt/sources.list || true
          fi
          pnpm --filter applyflow exec playwright install chromium
          set +e
          timeout 240 pnpm --filter applyflow exec playwright install-deps chromium
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "playwright install-deps failed or timed out (exit=$status); retrying once..."
            timeout 240 pnpm --filter applyflow exec playwright install-deps chromium
          fi

      - name: ApplyFlow critical E2E
        working-directory: apps/applyflow
        env:
          APPLYFLOW_E2E: "1"
          APPLYFLOW_E2E_SECRET: applyflow-e2e-ci-only-secret
          APPLYFLOW_E2E_PROVIDER_FIXTURES: "1"
          APPLYFLOW_E2E_IGNORE_SUPABASE: "1"
          CI: "1"
        run: pnpm test:e2e

      - name: ApplyFlow V2 cloud E2E
        working-directory: apps/applyflow
        env:
          APPLYFLOW_E2E: "1"
          APPLYFLOW_E2E_SECRET: applyflow-e2e-ci-only-secret
          APPLYFLOW_E2E_PROVIDER_FIXTURES: "1"
          APPLYFLOW_E2E_IGNORE_SUPABASE: "1"
          APPLYFLOW_PERSISTENCE_V2: "true"
          APPLYFLOW_THEIRSTACK_ENABLED: "false"
          APPLYFLOW_DB_TARGET: "local"
          NEXT_PUBLIC_APPLYFLOW_URL: "http://127.0.0.1:3012"
          CI: "1"
        run: pnpm test:e2e:v2

      - name: ApplyFlow closed-beta check
        working-directory: apps/applyflow
        env:
          APPLYFLOW_PERSISTENCE_V2: "true"
          APPLYFLOW_THEIRSTACK_ENABLED: "false"
          NEXT_PUBLIC_APPLYFLOW_URL: "http://127.0.0.1:3012"
        run: pnpm beta:check

  test-whatsapp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate WhatsApp Prisma client
        run: pnpm --filter @devflow/app-whatsapp-platform db:generate

      - name: Test WhatsApp
        run: pnpm --filter @devflow/app-whatsapp-platform test

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      # Secret scan — fail if a real-looking secret appears committed (ignores .env.example).
      - name: Secret scan
        run: pnpm check:secrets

      # Design-system + native button governance.
      - name: Buttons
        run: pnpm check:buttons

      - name: Design system
        run: pnpm -w run lint:design-system

      # Migration / Prisma schema validation (no real DB; generate validates the schema).
      - name: Validate Prisma schema
        run: pnpm db:generate

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CAREER_RUNTIME_ENVIRONMENT: test
      CAREER_AGENTS_ENABLED: "true"
      LIBRECHAT_ADAPTER_ENABLED: "false"
      LIBRECHAT_TRANSPORT_ENABLED: "false"
      CAREER_LLM_ENABLED: "false"
      CAREER_LLM_PROVIDER: mock
      CAREER_AUTOMATION_ENABLED: "false"
      CAREER_AUTOMATION_PROVIDER: mock
      OPENCLAW_ENABLED: "false"
      CAREER_PILOT_MODE: "false"
      NEXT_PUBLIC_CAREER_PILOT_MODE: "false"
      NEXT_PUBLIC_APP_VERSION: ci
      NEXT_PUBLIC_COMMIT_SHA: ci
      NEXT_PUBLIC_BUILD_TIMESTAMP: "1970-01-01T00:00:00.000Z"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -w run build
