<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">ApplyFlow architecture</title>
  <desc id="desc">Browser local-first UI and Match Engine with optional V2 API to PostgreSQL. Discovery providers contacted by the server without CV or profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050506"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="url(#bg)"/>
  <text x="48" y="56" fill="#34d399" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700">ApplyFlow architecture</text>
  <text x="48" y="88" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">Local-first default · optional authenticated V2 · CV not sent to discovery providers</text>

  <!-- Browser -->
  <rect x="48" y="120" width="520" height="520" rx="16" fill="rgba(24,24,27,0.94)" stroke="rgba(63,63,70,0.7)" filter="url(#shadow)"/>
  <text x="72" y="156" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600">Browser</text>

  <rect x="72" y="180" width="220" height="72" rx="10" fill="rgba(39,39,42,0.55)" stroke="rgba(82,82,91,0.6)"/>
  <text x="88" y="210" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Resume / Profile</text>
  <text x="88" y="232" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">local by default</text>

  <rect x="308" y="180" width="220" height="72" rx="10" fill="rgba(39,39,42,0.55)" stroke="rgba(82,82,91,0.6)"/>
  <text x="324" y="210" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">ApplyFlow UI</text>
  <text x="324" y="232" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Discovery ’ Lifecycle</text>

  <rect x="72" y="280" width="456" height="88" rx="10" fill="rgba(16,185,129,0.08)" stroke="rgba(52,211,153,0.45)"/>
  <text x="88" y="314" fill="#34d399" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Deterministic Match Engine</text>
  <text x="88" y="336" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">@devflow/applyflow-core · skill coverage · not an LLM</text>
  <text x="88" y="356" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">advisory decision ` user lifecycle intent</text>

  <rect x="72" y="396" width="456" height="72" rx="10" fill="rgba(39,39,42,0.55)" stroke="rgba(82,82,91,0.6)"/>
  <text x="88" y="426" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Local-first persistence</text>
  <text x="88" y="448" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Jobs / Applications in browser storage</text>

  <rect x="72" y="496" width="456" height="112" rx="10" fill="rgba(39,39,42,0.35)" stroke="rgba(52,211,153,0.35)" stroke-dasharray="5 4"/>
  <text x="88" y="528" fill="#34d399" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Optional V2 client</text>
  <text x="88" y="550" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">authenticated · pilot-gated · OCC</text>
  <text x="88" y="572" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">transactional Application ” Job lifecycle</text>
  <text x="88" y="594" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">tenant-scoped accountId</text>

  <!-- Server -->
  <rect x="620" y="120" width="532" height="320" rx="16" fill="rgba(24,24,27,0.94)" stroke="rgba(63,63,70,0.7)" filter="url(#shadow)"/>
  <text x="644" y="156" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600">ApplyFlow server (Next.js)</text>

  <rect x="644" y="180" width="484" height="64" rx="10" fill="rgba(39,39,42,0.55)" stroke="rgba(82,82,91,0.6)"/>
  <text x="660" y="208" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Auth · Origin checks · V2 API</text>
  <text x="660" y="228" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">server-derived account identity</text>

  <rect x="644" y="264" width="484" height="64" rx="10" fill="rgba(39,39,42,0.55)" stroke="rgba(82,82,91,0.6)"/>
  <text x="660" y="292" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="600">Provider adapters</text>
  <text x="660" y="312" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">filters only  no CV / profile payload</text>

  <rect x="644" y="348" width="148" height="56" rx="10" fill="rgba(16,185,129,0.1)" stroke="rgba(52,211,153,0.4)"/>
  <text x="664" y="382" fill="#34d399" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">Jobgether</text>

  <rect x="808" y="348" width="148" height="56" rx="10" fill="rgba(16,185,129,0.1)" stroke="rgba(52,211,153,0.4)"/>
  <text x="828" y="382" fill="#34d399" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">Remote OK</text>

  <rect x="972" y="348" width="156" height="56" rx="10" fill="rgba(248,113,113,0.08)" stroke="rgba(248,113,113,0.45)"/>
  <text x="988" y="372" fill="#f87171" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">TheirStack</text>
  <text x="988" y="392" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">shared OFF</text>

  <!-- Postgres -->
  <rect x="620" y="480" width="532" height="160" rx="16" fill="rgba(24,24,27,0.94)" stroke="rgba(63,63,70,0.7)" filter="url(#shadow)"/>
  <text x="644" y="524" fill="#fafafa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="600">PostgreSQL (V2 pilot)</text>
  <text x="644" y="556" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Jobs · Applications · account-scoped rows</text>
  <text x="644" y="580" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">OCC expectedVersion · unique (accountId, sourceJobId)</text>
  <text x="644" y="604" fill="#a1a1aa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Invite-only closed beta · public signup not approved</text>

  <!-- arrows -->
  <path d="M568 552 H620" stroke="#34d399" stroke-width="2" fill="none"/>
  <polygon points="620,552 608,546 608,558" fill="#34d399"/>
  <path d="M886 440 V480" stroke="#34d399" stroke-width="2" fill="none"/>
  <polygon points="886,480 880,468 892,468" fill="#34d399"/>
</svg>
